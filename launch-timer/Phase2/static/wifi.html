<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=800, initial-scale=1">
  <title>WiFi Setup</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"><style>@font-face{font-family:"Press Start 2P";src:url("/static/fonts/PressStart2P.woff2") format("woff2");}</style>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; image-rendering: pixelated; }
    body {
      background: #0a0e14;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      width: 800px; height: 480px;
      overflow: hidden;
      display: flex; flex-direction: column;
    }

    .scanlines {
      position: absolute; inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.1) 3px, rgba(0,0,0,0.1) 4px);
      pointer-events: none; z-index: 100;
    }

    /* TOP BAR */
    .topbar {
      height: 36px; flex-shrink: 0;
      background: #0d1620;
      border-bottom: 3px solid #00e87a;
      display: flex; align-items: center;
      padding: 0 12px; gap: 10px;
    }
    .back-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 7px;
      background: #0a1a10; border: 2px solid #00e87a;
      color: #00e87a; padding: 4px 8px; cursor: pointer;
    }
    .back-btn:hover { background: #0f2a18; }
    .top-sqs { display: flex; gap: 5px; }
    .top-sq { width: 9px; height: 9px; }
    .top-title-wrap { flex: 1; text-align: center; }
    .top-title { font-size: 8px; color: #fff; }
    .top-sub { font-size: 5px; color: rgba(0,232,122,0.5); margin-top: 2px; }
    .top-current {
      font-size: 5px; color: #ffd93d;
      background: #0a1a10; border: 2px solid #ffd93d;
      padding: 3px 7px; white-space: nowrap;
      max-width: 200px; overflow: hidden; text-overflow: ellipsis;
    }

    /* BODY */
    .body { flex: 1; display: flex; overflow: hidden; }

    /* LEFT — network list */
    .left-col {
      width: 360px; flex-shrink: 0;
      display: flex; flex-direction: column;
      border-right: 3px solid #2a3a50;
      background: #0e1520;
    }
    .phdr {
      font-size: 6px; color: #00e87a;
      background: #141e2e; padding: 6px 10px;
      border-bottom: 2px solid #2a3a50;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .phdr-left { display: flex; align-items: center; gap: 6px; }
    .phdr-dot { width: 7px; height: 7px; flex-shrink: 0; }
    .btn-scan-sm {
      font-family: 'Press Start 2P', monospace;
      font-size: 5px; background: #141e2e;
      border: 2px solid #6ab4f8; color: #6ab4f8;
      padding: 3px 6px; cursor: pointer;
    }
    .btn-scan-sm:disabled { opacity: 0.4; cursor: not-allowed; }

    .networks-list {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding: 6px;
      display: flex; flex-direction: column; gap: 5px;
    }
    .network {
      background: #1a2535;
      border: 2px solid #344558;
      padding: 9px 10px;
      cursor: pointer;
      font-size: 7px; color: #ffffff;
      display: flex; align-items: center; gap: 8px;
      flex-shrink: 0;
    }
    .network:hover { background: #1f2e42; border-color: rgba(0,232,122,0.6); }
    .network.selected { background: #0a1f10; border-color: #00e87a; color: #00e87a; }
    .network.current-net { border-color: #ffd93d; }
    .network-signal { font-size: 7px; flex-shrink: 0; color: #6ab4f8; }
    .network-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .network-badge { font-size: 5px; color: #ffd93d; flex-shrink: 0; background: rgba(255,211,61,0.1); border: 1px solid #ffd93d; padding: 2px 4px; }
    .scan-msg { font-size: 6px; color: rgba(255,255,255,0.5); text-align: center; padding: 20px 8px; }

    /* RIGHT — connect panel */
    .right-col {
      flex: 1;
      display: flex; flex-direction: column;
      padding: 16px 18px 12px;
      background: #0c1018;
    }

    .connect-hdr {
      font-size: 6px; color: #4a9ede; letter-spacing: 2px;
      margin-bottom: 12px; flex-shrink: 0;
    }

    /* Selected network display */
    .ssid-display {
      background: #141e2e;
      border: 2px solid #2a3a50;
      padding: 10px 12px;
      margin-bottom: 16px;
      flex-shrink: 0;
    }
    .ssid-display-label { font-size: 5px; color: #4a9ede; letter-spacing: 2px; margin-bottom: 6px; }
    .ssid-display-val { font-size: 9px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ssid-display-val.placeholder { color: rgba(255,255,255,0.3); font-size: 7px; }
    .ssid-display.has-selection { border-color: #00e87a; }

    /* Password field */
    .pw-block { flex-shrink: 0; margin-bottom: 16px; }
    .pw-label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .pw-label { font-size: 5px; color: #4a9ede; letter-spacing: 2px; }
    .pw-hint { font-size: 5px; color: rgba(255,255,255,0.3); }
    .pw-input-wrap { position: relative; }
    input.pw-field {
      width: 100%;
      background: #1a2535;
      border: 2px solid #344558;
      padding: 11px 44px 11px 10px;
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      outline: none;
      caret-color: #00e87a;
    }
    input.pw-field:focus {
      border-color: #00e87a;
      background: #0a1f12;
    }
    .show-toggle {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      font-family: 'Press Start 2P', monospace;
      font-size: 5px; color: rgba(255,255,255,0.4);
      cursor: pointer; user-select: none; background: none; border: none;
      padding: 4px;
    }
    .show-toggle:hover { color: #ffd93d; }

    /* Connect button */
    .connect-btn {
      width: 100%;
      padding: 13px;
      font-family: 'Press Start 2P', monospace;
      font-size: 8px; cursor: pointer; border: none;
      background: #00e87a; color: #050a07;
      flex-shrink: 0; margin-bottom: 10px;
    }
    .connect-btn:disabled { background: rgba(0,232,122,0.2); color: rgba(0,50,20,0.5); cursor: not-allowed; }

    /* Status */
    .status-bar {
      flex-shrink: 0;
      font-size: 6px; color: #ffd93d;
      letter-spacing: 1px; min-height: 16px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .status-bar.success { color: #00e87a; }
    .status-bar.error   { color: #ff4422; }
  </style>
</head>
<body>
  <div class="scanlines"></div>

  <div class="topbar">
    <button class="back-btn" id="btn-back" onclick="window.location='/settings'">← BACK</button>
    <div class="top-sqs">
      <div class="top-sq" style="background:#00e87a;"></div>
      <div class="top-sq" style="background:#4a9ede;"></div>
      <div class="top-sq" style="background:#ffd93d;"></div>
    </div>
    <div class="top-title-wrap">
      <div class="top-title">WIFI SETUP</div>
      <div class="top-sub">// NETWORK CONFIGURATION //</div>
    </div>
    <div class="top-current" id="top-current" style="display:none;">CONNECTED: —</div>
  </div>

  <div class="body">

    <!-- LEFT: network list -->
    <div class="left-col">
      <div class="phdr">
        <div class="phdr-left">
          <div class="phdr-dot" style="background:#4a9ede;"></div>
          <span>AVAILABLE NETWORKS</span>
        </div>
        <button class="btn-scan-sm" id="btn-scan" onclick="scanNetworks()">↺ SCAN</button>
      </div>
      <div class="networks-list" id="networks">
        <div class="scan-msg">SCANNING...</div>
      </div>
    </div>

    <!-- RIGHT: connect panel -->
    <div class="right-col">
      <div class="connect-hdr">> CONNECT TO NETWORK</div>

      <div class="ssid-display" id="ssid-display">
        <div class="ssid-display-label">SELECTED NETWORK</div>
        <div class="ssid-display-val placeholder" id="ssid-val">— TAP A NETWORK —</div>
      </div>

      <div class="pw-block">
        <div class="pw-label-row">
          <div class="pw-label">PASSWORD</div>
          <div class="pw-hint">TAP FIELD TO TYPE</div>
        </div>
        <div class="pw-input-wrap">
          <input type="password" class="pw-field" id="password"
                 placeholder="••••••••"
                 autocomplete="off" autocorrect="off"
                 autocapitalize="off" spellcheck="false"
                 onfocus="fetch('/api/osk?show=1').catch(()=>{})"
                 onblur="fetch('/api/osk?show=0').catch(()=>{})" >
          <button class="show-toggle" id="show-toggle" onclick="toggleShow()">SHOW</button>
        </div>
      </div>

      <button class="connect-btn" id="btn-connect" onclick="connect()" disabled>CONNECT</button>

      <div class="status-bar" id="status"></div>
    </div>

  </div>

  <script>
    let selectedSsid = '';
    let showPassword = false;

    function toggleShow() {
      showPassword = !showPassword;
      const input = document.getElementById('password');
      input.type = showPassword ? 'text' : 'password';
      document.getElementById('show-toggle').textContent = showPassword ? 'HIDE' : 'SHOW';
    }

    function selectNetwork(ssid, isCurrent) {
      selectedSsid = ssid;
      const valEl = document.getElementById('ssid-val');
      valEl.textContent = ssid;
      valEl.classList.remove('placeholder');
      document.getElementById('ssid-display').classList.add('has-selection');
      document.getElementById('btn-connect').disabled = false;
      setStatus(isCurrent ? 'ALREADY CONNECTED — RECONNECT TO CHANGE' : 'SELECTED: ' + ssid.toUpperCase(), '');
      // Focus the password field and show OSK
      document.getElementById('password').focus();
      fetch('/api/osk?show=1').catch(() => {});
    }

    function setStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status-bar' + (type ? ' ' + type : '');
    }

    function setConnecting(busy) {
      document.getElementById('btn-connect').disabled = busy;
      document.getElementById('btn-scan').disabled = busy;
      document.getElementById('btn-back').disabled = busy;
    }

    function connect() {
      if (!selectedSsid) { setStatus('SELECT A NETWORK FIRST', 'error'); return; }
      const password = document.getElementById('password').value;
      // Dismiss keyboard before connecting
      document.getElementById('password').blur();
      fetch('/api/osk?show=0').catch(() => {});
      setConnecting(true);
      setStatus('CONNECTING TO ' + selectedSsid.toUpperCase() + '...', '');
      fetch('/api/wifi/connect', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ssid: selectedSsid, password })
      })
      .then(r => r.json())
      .then(data => {
        if (data.ok) {
          setStatus('CONNECTED — RETURNING TO HOME', 'success');
          setTimeout(() => { window.location = '/'; }, 2500);
        } else {
          setStatus('FAILED: ' + (data.error || 'UNKNOWN ERROR').toUpperCase(), 'error');
          setConnecting(false);
        }
      })
      .catch(() => {
        // Fetch failing likely means network switched — treat as success
        setStatus('CONNECTED — RETURNING TO HOME', 'success');
        setTimeout(() => { window.location = '/'; }, 2500);
      });
    }

    function scanNetworks() {
      const container = document.getElementById('networks');
      container.innerHTML = '<div class="scan-msg">SCANNING...</div>';
      document.getElementById('btn-scan').disabled = true;

      let currentSsid = '';

      fetch('/api/wifi/current').then(r => r.json()).then(d => {
        currentSsid = (d.ssid || '').trim();
        if (currentSsid) {
          const el = document.getElementById('top-current');
          el.textContent = 'CONNECTED: ' + currentSsid.toUpperCase();
          el.style.display = '';
        }
      }).catch(() => {});

      fetch('/api/wifi/scan').then(r => r.json()).then(data => {
        document.getElementById('btn-scan').disabled = false;
        container.innerHTML = '';
        if (!data.networks || !data.networks.length) {
          container.innerHTML = '<div class="scan-msg">NO NETWORKS FOUND</div>';
          return;
        }
        data.networks.forEach(ssid => {
          const isCurrent = ssid === currentSsid;
          const div = document.createElement('div');
          div.className = 'network' + (isCurrent ? ' current-net' : '');

          const sig = document.createElement('span');
          sig.className = 'network-signal';
          sig.textContent = '|||';

          const name = document.createElement('span');
          name.className = 'network-name';
          name.textContent = ssid;

          div.appendChild(sig);
          div.appendChild(name);

          if (isCurrent) {
            const badge = document.createElement('span');
            badge.className = 'network-badge';
            badge.textContent = 'CONNECTED';
            div.appendChild(badge);
          }

          div.addEventListener('click', () => {
            document.querySelectorAll('.network').forEach(n => n.classList.remove('selected'));
            div.classList.add('selected');
            selectNetwork(ssid, isCurrent);
          });
          container.appendChild(div);
        });
      }).catch(() => {
        document.getElementById('btn-scan').disabled = false;
        container.innerHTML = '<div class="scan-msg">SCAN FAILED — TAP SCAN</div>';
      });
    }

    scanNetworks();
  </script>
</body>
</html>
