<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=800, initial-scale=1">
  <title>WiFi Setup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a1e; color: #fff; font-family: 'Courier New', monospace; width: 800px; height: 480px; overflow: hidden; display: flex; flex-direction: column; padding: 10px; }
    h1 { color: #00e87a; font-size: 14px; text-align: center; margin-bottom: 4px; }
    .networks { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; max-height: 52px; overflow-y: auto; }
    .network { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 3px; padding: 4px 10px; cursor: pointer; font-size: 11px; }
    .network.selected { background: rgba(0,232,122,0.15); border-color: #00e87a; color: #00e87a; }
    .fields { display: flex; gap: 8px; margin-bottom: 6px; }
    .field { flex: 1; }
    .field label { font-size: 8px; color: rgba(255,255,255,0.4); display: block; margin-bottom: 2px; }
    .field input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 3px; padding: 5px 8px; color: #fff; font-family: 'Courier New', monospace; font-size: 12px; }
    .field input.active { border-color: #00e87a; }
    .keyboard { flex: 1; display: flex; flex-direction: column; gap: 3px; margin-bottom: 6px; }
    .kb-row { display: flex; gap: 3px; justify-content: center; flex: 1; }
    .kb-key { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 3px; color: #fff; font-family: 'Courier New', monospace; font-size: 12px; cursor: pointer; flex: 1; text-align: center; max-width: 56px; }
    .kb-key:active { background: rgba(0,232,122,0.2); border-color: #00e87a; }
    .kb-key.wide { flex: 2; max-width: 80px; }
    .kb-key.space { flex: 8; max-width: 320px; }
    .kb-key.action { background: rgba(0,232,122,0.15); border-color: #00e87a; color: #00e87a; }
    .kb-key.toggled { background: rgba(255,211,61,0.2); border-color: #ffd93d; color: #ffd93d; }
    .bottom { display: flex; gap: 8px; height: 36px; }
    .btn { flex: 1; border-radius: 3px; font-family: 'Courier New', monospace; font-size: 12px; font-weight: bold; cursor: pointer; border: none; }
    .btn-connect { background: #00e87a; color: #0a0a1e; }
    .btn-connect:disabled { background: rgba(0,232,122,0.3); cursor: not-allowed; }
    .btn-back { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.5); }
    .status { font-size: 10px; text-align: center; height: 14px; margin-top: 2px; color: #ffd93d; }
    .status.success { color: #00e87a; }
    .status.error { color: #ff4422; }
  </style>
</head>
<body>
  <h1>WiFi Setup</h1>
  <div class="networks" id="networks"><span style="color:rgba(255,255,255,0.3);font-size:11px">Scanning...</span></div>
  <div class="fields">
    <div class="field">
      <label>NETWORK (SSID)</label>
      <input type="text" id="ssid" placeholder="Network name" onfocus="setActive('ssid')" readonly />
    </div>
    <div class="field">
      <label>PASSWORD</label>
      <input type="text" id="password" placeholder="Password" onfocus="setActive('password')" readonly />
    </div>
  </div>
  <div class="keyboard">
    <div class="kb-row" id="row1"></div>
    <div class="kb-row" id="row2"></div>
    <div class="kb-row" id="row3"></div>
    <div class="kb-row" id="row4"></div>
  </div>
  <div class="bottom">
    <button class="btn btn-back" id="btn-back" onclick="window.location='http://localhost:5001'">BACK</button>
    <button class="btn btn-connect" id="btn-connect" onclick="connect()">CONNECT</button>
  </div>
  <div class="status" id="status"></div>

  <script>
    let activeField = 'password';
    let shifted = false;
    let symbols = false;

    const letterRows = [
      ['1','2','3','4','5','6','7','8','9','0'],
      ['q','w','e','r','t','y','u','i','o','p'],
      ['a','s','d','f','g','h','j','k','l'],
      ['z','x','c','v','b','n','m'],
    ];
    const symbolRows = [
      ['!','@','#','$','%','^','&','*','(',')'],
      ['-','_','+','=','[',']','{','}'],
      [';',':','\'','"',',','.','?','/'],
      ['\\','|','`','~','<','>'],
    ];

    function setActive(id) {
      activeField = id;
      document.querySelectorAll('.field input').forEach(i => i.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function buildKeyboard() {
      const rows = symbols ? symbolRows : letterRows;
      const rowIds = ['row1','row2','row3','row4'];
      rowIds.forEach((id, i) => {
        const el = document.getElementById(id);
        el.innerHTML = '';
        const row = rows[i] || [];
        row.forEach(k => {
          const btn = document.createElement('button');
          btn.className = 'kb-key';
          btn.textContent = (!symbols && shifted) ? k.toUpperCase() : k;
          btn.addEventListener('click', () => typeKey(btn.textContent));
          el.appendChild(btn);
        });
        if (i === 3) {
          const symBtn = document.createElement('button');
          symBtn.className = 'kb-key wide' + (symbols ? ' toggled' : '');
          symBtn.textContent = symbols ? 'ABC' : '!@#';
          symBtn.addEventListener('click', toggleSymbols);
          el.prepend(symBtn);

          if (!symbols) {
            const shift = document.createElement('button');
            shift.className = 'kb-key wide' + (shifted ? ' action' : '');
            shift.textContent = '⇧';
            shift.addEventListener('click', toggleShift);
            el.prepend(shift);
          }

          const space = document.createElement('button');
          space.className = 'kb-key space';
          space.textContent = 'SPACE';
          space.addEventListener('click', () => typeKey(' '));
          el.appendChild(space);

          const bksp = document.createElement('button');
          bksp.className = 'kb-key wide action';
          bksp.textContent = '⌫';
          bksp.addEventListener('click', backspace);
          el.appendChild(bksp);
        }
      });
    }

    function typeKey(k) {
      document.getElementById(activeField).value += k;
      if (shifted && !symbols) { shifted = false; buildKeyboard(); }
    }

    function backspace() {
      const el = document.getElementById(activeField);
      el.value = el.value.slice(0, -1);
    }

    function toggleShift() {
      shifted = !shifted;
      buildKeyboard();
    }

    function toggleSymbols() {
      symbols = !symbols;
      shifted = false;
      buildKeyboard();
    }

    function setStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status' + (type ? ' ' + type : '');
    }

    function connect() {
      const ssid = document.getElementById('ssid').value.trim();
      const password = document.getElementById('password').value;
      if (!ssid) { setStatus('Please select or enter a network', 'error'); return; }

      // Disable buttons while connecting
      document.getElementById('btn-connect').disabled = true;
      document.getElementById('btn-back').disabled = true;
      setStatus('Testing connection... (up to 10s)', '');

      fetch('/api/wifi/connect', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ssid, password })
      })
      .then(r => r.json())
      .then(data => {
        if (data.ok) {
          setStatus('Connected to ' + ssid + '! Returning...', 'success');
          setTimeout(() => { window.location = 'http://localhost:5001'; }, 3000);
        } else {
          setStatus('Failed: ' + (data.error || 'unknown error'), 'error');
          document.getElementById('btn-connect').disabled = false;
          document.getElementById('btn-back').disabled = false;
        }
      })
      .catch(() => {
        // If fetch fails it may mean we switched networks — try returning anyway
        setStatus('Connected! Returning...', 'success');
        setTimeout(() => { window.location = 'http://localhost:5001'; }, 3000);
      });
    }

    setActive('password');
    buildKeyboard();

    fetch('/api/wifi/scan').then(r => r.json()).then(data => {
      const container = document.getElementById('networks');
      container.innerHTML = '';
      if (!data.networks.length) { container.innerHTML = '<span style="color:rgba(255,255,255,0.3);font-size:11px">No networks found</span>'; return; }
      data.networks.forEach(ssid => {
        const div = document.createElement('div');
        div.className = 'network';
        div.textContent = ssid;
        div.addEventListener('click', () => {
          document.querySelectorAll('.network').forEach(n => n.classList.remove('selected'));
          div.classList.add('selected');
          document.getElementById('ssid').value = ssid;
          setActive('password');
        });
        container.appendChild(div);
      });
    });
  </script>
</body>
</html>
