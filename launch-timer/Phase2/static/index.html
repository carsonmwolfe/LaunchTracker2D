<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=800" />
  <title>Launch Countdown</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }

    #wrapper {
      position: relative;
      width: 800px;
      height: 390px;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
    }

    /* TEST LAUNCH button — top-left, same position as tkinter version */
    #btn-test {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: #ff6600;
      color: #fff;
      border: none;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      font-weight: bold;
      padding: 6px 12px;
      cursor: pointer;
      letter-spacing: 1px;
    }
    #btn-test:hover { background: #ff8833; }
    #btn-test:active { background: #cc5500; }

    #btn-launches {
      position: absolute;
      top: 48px;
      left: 10px;
      z-index: 10;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,211,61,0.6);
      border-radius: 4px;
      color: #ffd93d;
      font-family: 'Courier New', monospace;
      font-size: 9px;
      font-weight: bold;
      padding: 4px 10px;
      cursor: pointer;
      letter-spacing: 1px;
}
    #btn-launches:hover { background: rgba(74,158,222,0.35); }

    #info-bar {
      position: absolute;
      bottom: 0; left: 0;
      width: 800px; height: 90px;
      background: rgba(8,8,18,0.97);
      border-top: 2px solid rgba(0,232,122,0.35);
      display: flex;
      font-family: 'Courier New', monospace;
      z-index: 5;
    }
    #ib-left {
      flex: 1.3;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
      border-right: 1px solid rgba(255,255,255,0.07);
      min-width: 0;
    }
    #ib-name-row { display: flex; align-items: center; gap: 10px; }
    #ib-name { font-size: 20px; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #ib-badge { font-size: 10px; padding: 3px 9px; border-radius: 3px; font-weight: bold; letter-spacing: 0.08em; flex-shrink: 0; background: rgba(255,211,61,0.15); border: 1px solid rgba(255,211,61,0.4); color: #ffd93d; }
    #ib-badge.go   { background: rgba(0,232,122,0.15);  border-color: rgba(0,232,122,0.4);  color: #00e87a; }
    #ib-badge.hold { background: rgba(255,68,34,0.15);  border-color: rgba(255,68,34,0.4);  color: #ff4422; }
    #ib-sub { font-size: 11px; color: #4a9ede; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #ib-tap { font-size: 9px; color: rgba(0,232,122,0.45); letter-spacing: 0.06em; cursor: pointer; }
    #ib-center {
      width: 230px; flex-shrink: 0;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      gap: 4px; padding: 8px 14px;
      border-right: 1px solid rgba(255,255,255,0.07);
    }
    #ib-date { font-size: 11px; color: #ffd93d; letter-spacing: 0.04em; }
    #ib-cd   { font-size: 15px; font-weight: bold; color: #00e87a; letter-spacing: 0.06em; }
    #ib-win-wrap { width: 100%; }
    #ib-win-bar  { height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; position: relative; margin: 4px 0 3px; }
    #ib-win-fill { position: absolute; inset: 0; background: rgba(0,232,122,0.2); border-radius: 2px; }
    .ib-win-dot  { position: absolute; top: -4px; width: 12px; height: 12px; border-radius: 50%; transform: translateX(-50%); border: 2px solid #080810; }
    #ib-win-times { display: flex; justify-content: space-between; font-size: 8px; color: rgba(255,255,255,0.22); }
    #ib-right {
      width: 200px; flex-shrink: 0;
      display: flex; flex-direction: column;
      justify-content: center; padding: 10px 16px; gap: 6px;
    }
    #ib-wx-row { display: flex; }
    .ib-wx { flex: 1; text-align: center; }
    .ib-wx-val { font-size: 13px; font-weight: bold; color: #fff; line-height: 1; }
    .ib-wx-lbl { font-size: 8px; color: rgba(255,255,255,0.25); margin-top: 3px; letter-spacing: 0.05em; }
    #ib-ver { font-size: 8px; color: rgba(255,255,255,0.15); text-align: right; }
    #ib-prob-wrap { width: 100%; }
    #ib-prob-row { display: flex; align-items: center; gap: 6px; }
    #ib-prob-label { font-size: 7px; color: rgba(255,255,255,0.25); letter-spacing: 0.08em; flex-shrink: 0; }
    #ib-prob-bar { flex: 1; height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
    #ib-prob-fill { height: 100%; border-radius: 2px; width: 0%; transition: width 0.5s; }
    #ib-prob-pct { font-size: 9px; font-weight: bold; width: 28px; text-align: right; flex-shrink: 0; }
  </style>
</head>
<body>
  <div id="wrapper">
    <canvas id="c" width="800" height="390"></canvas>
    <button id="btn-test">TEST LAUNCH</button>
    <button id="btn-launches" onclick="window.location='http://localhost:5001/launches'">LAUNCHES & EVENTS</button>

    <div id="info-bar">
      <div id="ib-left">
        <div id="ib-name-row">
          <div id="ib-name">—</div>
          <div id="ib-badge">TBD</div>
        </div>
        <div id="ib-sub">—</div>
        <div id="ib-tap">TAP FOR DETAILS →</div>
      </div>
      <div id="ib-center">
        <div id="ib-date">—</div>
        <div id="ib-cd">T− --:--:--</div>
        <div id="ib-prob-wrap" style="display:none;">
          <div id="ib-prob-row">
            <span id="ib-prob-label">LAUNCH PROB</span>
            <div id="ib-prob-bar"><div id="ib-prob-fill"></div></div>
            <span id="ib-prob-pct">—</span>
          </div>
        </div>
        <div id="ib-win-wrap">
          <div id="ib-win-bar">
            <div id="ib-win-fill"></div>
            <div class="ib-win-dot" id="ib-dot-open"  style="left:0%;background:#ffd93d;"></div>
            <div class="ib-win-dot" id="ib-dot-t0"    style="left:33%;background:#00e87a;"></div>
            <div class="ib-win-dot" id="ib-dot-close" style="left:100%;background:#ffd93d;"></div>
          </div>
          <div id="ib-win-times">
            <span id="ib-win-open">— OPEN</span>
            <span id="ib-win-close">CLOSE —</span>
          </div>
        </div>
      </div>
      <div id="ib-right">
        <div id="ib-wx-row">
          <div class="ib-wx"><div class="ib-wx-val" id="ib-temp">—</div><div class="ib-wx-lbl">TEMP</div></div>
          <div class="ib-wx"><div class="ib-wx-val" id="ib-wind">—</div><div class="ib-wx-lbl">WIND</div></div>
          <div class="ib-wx"><div class="ib-wx-val" id="ib-cloud">—</div><div class="ib-wx-lbl">CLOUD</div></div>
          <div class="ib-wx"><div class="ib-wx-val" id="ib-precip">—</div><div class="ib-wx-lbl">PRECIP</div></div>
        </div>
        <div id="ib-ver">v1.0.0 · data 0m ago</div>
      </div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
