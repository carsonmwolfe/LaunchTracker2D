<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=800" />
  <title>Launch Countdown</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    * { cursor: none !important; }

    body {
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 480px;
      overflow: hidden;
    }

    #wrapper {
      position: relative;
      width: 800px;
      height: 480px;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
    }

    #btn-test {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: #ff6600;
      color: #fff;
      border: none;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      font-weight: bold;
      padding: 6px 12px;
      cursor: pointer;
      letter-spacing: 1px;
    }
    #btn-test:hover { background: #ff8833; }
    #btn-test:active { background: #cc5500; }

    #btn-launches {
      position: absolute;
      top: 48px;
      left: 10px;
      z-index: 10;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,211,61,0.6);
      border-radius: 4px;
      color: #ffd93d;
      font-family: 'Courier New', monospace;
      font-size: 9px;
      font-weight: bold;
      padding: 4px 10px;
      cursor: pointer;
      letter-spacing: 1px;
    }
    #btn-launches:hover { background: rgba(74,158,222,0.35); }

    /* ── Info bar ── */
    #info-bar {
      position: absolute;
      bottom: 0; left: 0;
      width: 800px; height: 90px;
      background: rgba(8,8,18,0.97);
      border-top: 2px solid rgba(0,232,122,0.35);
      display: flex;
      font-family: 'Courier New', monospace;
      z-index: 5;
    }

    /* LEFT panel — launch window */
    #ib-window {
      width: 190px; flex-shrink: 0;
      padding: 0 16px;
      display: flex; flex-direction: column;
      justify-content: center; gap: 6px;
      border-right: 1px solid rgba(255,255,255,0.07);
    }
    #ib-win-label { font-size: 8px; color: rgba(255,255,255,0.3); letter-spacing: 0.1em; }
    #ib-win-times-row { display: flex; justify-content: space-between; align-items: baseline; }
    .ib-win-time { font-size: 18px; font-weight: bold; color: #ffd93d; line-height: 1; }
    .ib-win-sublbl { font-size: 8px; color: rgba(255,255,255,0.25); margin-top: 3px; letter-spacing: 0.05em; }
    #ib-win-sep { font-size: 10px; color: rgba(255,255,255,0.2); }
    #ib-win-track {
      height: 3px; background: rgba(255,255,255,0.08);
      border-radius: 2px; position: relative;
    }
    #ib-win-dot {
      position: absolute; top: 50%; transform: translate(-50%, -50%);
      width: 9px; height: 9px; border-radius: 50%;
      background: #00e87a; border: 2px solid #080810;
      left: 0%;
    }

    /* CENTER panel — mission info */
    #ib-left {
      flex: 1;
      padding: 0 20px;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      gap: 5px; min-width: 0; overflow: hidden;
      cursor: pointer;
    }
    #ib-name-row { display: flex; align-items: center; gap: 8px; width: 100%; justify-content: center; min-width: 0; }
    #ib-name { font-size: 20px; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #ib-badge { font-size: 10px; padding: 2px 9px; font-weight: bold; letter-spacing: 0.06em; flex-shrink: 0; background: rgba(255,211,61,0.15); border: 1px solid rgba(255,211,61,0.4); color: #ffd93d; }
    #ib-badge.go   { background: rgba(0,232,122,0.15); border-color: rgba(0,232,122,0.4); color: #00e87a; }
    #ib-badge.hold { background: rgba(255,68,34,0.15);  border-color: rgba(255,68,34,0.4);  color: #ff4422; }
    #ib-prob-badge { font-size: 10px; padding: 2px 9px; font-weight: bold; letter-spacing: 0.06em; flex-shrink: 0; background: rgba(0,232,122,0.08); border: 1px solid rgba(0,232,122,0.2); color: #00e87a; display: none; }
    #ib-detail-row { font-size: 11px; text-align: center; line-height: 1.6; width: 100%; overflow: hidden; }
    #ib-sub      { color: #4a9ede; }
    #ib-location { color: rgba(255,255,255,0.6); }
    #ib-t0       { color: #ffd93d; }
    .ib-sep      { color: rgba(255,255,255,0.25); }

    /* hidden — kept for JS compat */
    #ib-tap { display: none; }
    #ib-cd  { display: none; }
    #ib-date { display: none; }
    #ib-prob-wrap { display: none; }
    #ib-center { display: none; }

    /* RIGHT panel — weather */
    #ib-right {
      width: 190px; flex-shrink: 0;
      padding: 0 16px;
      display: flex; flex-direction: column;
      justify-content: center; gap: 6px;
      border-left: 1px solid rgba(255,255,255,0.07);
    }
    #ib-wx-row { display: flex; justify-content: space-between; align-items: flex-end; }
    .ib-wx { text-align: center; }
    .ib-wx-val { font-size: 20px; font-weight: bold; color: #fff; line-height: 1; }
    .ib-wx-lbl { font-size: 8px; color: rgba(255,255,255,0.3); margin-top: 4px; letter-spacing: 0.05em; }
    #ib-ver { font-size: 9px; color: rgba(255,255,255,0.4); text-align: right; letter-spacing: 0.04em; }
  </style>
</head>
<body>
  <div id="wrapper">
    <canvas id="c" width="800" height="480"></canvas>
    <button id="btn-test">TEST LAUNCH</button>
    <button id="btn-launches" onclick="window.location='http://localhost:5001/launches'">LAUNCHES & EVENTS</button>

    <div id="info-bar">

      <!-- LEFT: launch window -->
      <div id="ib-window">
        <div id="ib-win-label">LAUNCH WINDOW</div>
        <div id="ib-win-times-row">
          <div>
            <div class="ib-win-time" id="ib-win-open">—:—</div>
            <div class="ib-win-sublbl">OPEN</div>
          </div>
          <div id="ib-win-sep">—</div>
          <div style="text-align:right;">
            <div class="ib-win-time" id="ib-win-close">—:—</div>
            <div class="ib-win-sublbl">CLOSE</div>
          </div>
        </div>
        <div id="ib-win-track">
          <div id="ib-win-dot"></div>
        </div>
        <!-- hidden compat elements -->
        <div id="ib-win-wrap" style="display:none;"><div id="ib-win-bar"><div id="ib-win-fill"></div></div></div>
      </div>

      <!-- CENTER: mission info — tappable → mission page -->
      <div id="ib-left" onclick="window.location='http://localhost:5001/mission'">
        <div id="ib-name-row">
          <div id="ib-name">—</div>
          <div id="ib-badge">TBD</div>
          <div id="ib-prob-badge">—%</div>
        </div>
        <div id="ib-detail-row">
          <span id="ib-sub">—</span><span class="ib-sep"> · </span><span id="ib-location">—</span><span class="ib-sep"> · </span><span id="ib-t0">—</span>
        </div>
        <!-- hidden — kept for JS compat -->
        <div id="ib-tap" style="display:none;"></div>
        <div id="ib-cd" style="display:none;"></div>
        <div id="ib-date" style="display:none;"></div>
        <div id="ib-prob-wrap" style="display:none;">
          <div id="ib-prob-row">
            <span id="ib-prob-label"></span>
            <div id="ib-prob-bar"><div id="ib-prob-fill"></div></div>
            <span id="ib-prob-pct">—</span>
          </div>
        </div>
      </div>

      <!-- hidden center — kept for JS compat -->
      <div id="ib-center" style="display:none;"></div>

      <!-- RIGHT: weather -->
      <div id="ib-right">
        <div id="ib-wx-row">
          <div class="ib-wx"><div class="ib-wx-val" id="ib-temp">—</div><div class="ib-wx-lbl">TEMP</div></div>
          <div class="ib-wx"><div class="ib-wx-val" id="ib-wind">—</div><div class="ib-wx-lbl">WIND mph</div></div>
          <div class="ib-wx"><div class="ib-wx-val" id="ib-cloud">—</div><div class="ib-wx-lbl">CLOUD</div></div>
        </div>
        <div id="ib-ver">v1.0.0 · data 0m ago</div>
      </div>

    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
